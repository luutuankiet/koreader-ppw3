services:
  kindle-gateway:
    build: .
    container_name: kindle-gateway
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=${GATEWAY_PORT:-9999}
      - PLUGINS_SRC=/workspace
      - EINK_DELAY=${EINK_DELAY:-1500}
    volumes:
      - ${WORKSPACE_DIR:-..}:/workspace:ro
    labels:
      - "traefik.enable=false"
