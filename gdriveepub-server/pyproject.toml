[project]
name = "gdriveepub"
version = "0.2.0"
description = "Cloud Run service that lists Google Drive files and serves Google Docs as cleaned EPUBs to a KOReader plugin"
requires-python = ">=3.12"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "lxml>=5.2",
  "google-cloud-storage>=2.18",
]

[project.scripts]
gdriveepub = "gdriveepub.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdriveepub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
