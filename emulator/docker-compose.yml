services:
  koreader-emu:
    build:
      context: ..
      dockerfile: emulator/Dockerfile
    image: koreader-emu:2026.07.1
    container_name: koreader-emu
    restart: unless-stopped
    init: true
    # Host networking: kindle-gateway runs on this host with host networking too.
    network_mode: host
    environment:
      MCP_LIVE_MODE: "always"
      MCP_DEVICE_NAME: "emu"
      MCP_GATEWAY_HOST: "127.0.0.1"
      MCP_GATEWAY_DEVICE_PORT: "9990"
    volumes:
      # Gitignored. KO_HOME: settings.reader.lua, settings/kosync.lua, history, cache.
      - ./state/koreader-home:/mnt/us/koreader-home
      # Gitignored test books.
      - ./library:/mnt/us/documents
    labels:
      - "traefik.enable=false"

  # Live view and control of the emulator's screen, no password, like koreader_mcp
  # on 8889: VNC client at thinkpad:5973, browser at http://thinkpad:6073/.
  # 5900 is taken on the host. No depends_on: starting this service never
  # recreates koreader-emu; it waits for the display itself.
  vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
    image: koreader-emu-vnc
    container_name: koreader-emu-vnc
    restart: unless-stopped
    init: true
    # Host networking: reaches the emulator's X display through the shared abstract socket.
    network_mode: host
    environment:
      DISPLAY: ":73"
      VNC_PORT: "5973"
      NOVNC_PORT: "6073"
    labels:
      - "traefik.enable=false"
